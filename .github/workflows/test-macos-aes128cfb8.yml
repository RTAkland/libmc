name: Test macos aes128cfb8.yml

on:
  workflow_dispatch:

jobs:
  test-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradle executable
        run: chmod +x ./gradlew

      - name: Run macosArm64 tests for protocol module
        run: ./gradlew :protocol:macosArm64Test